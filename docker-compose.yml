services:

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: >
      /bin/sh -c "
        sleep 10 &&
        ollama pull llama3.2 &&
        ollama pull nomic-embed-text &&
        echo 'Done!'
      "
    volumes:
      - ollama_data:/root/.ollama
    restart: "no"

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: medical_ai
      MYSQL_USER: medai
      MYSQL_PASSWORD: medai2025
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"    # REST API (browser UI at http://localhost:6333/dashboard)
      - "6334:6334"    # gRPC (Spring AI uses this)
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  ollama_data:
  mysql_data:
  qdrant_data: